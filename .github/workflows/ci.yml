name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://crm:crm@localhost:5432/crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations to PostgreSQL
        run: alembic upgrade head && alembic check
      - name: Run tests against PostgreSQL
        run: |
          alembic downgrade base
          TEST_DATABASE_URL=$DATABASE_URL pytest -q
